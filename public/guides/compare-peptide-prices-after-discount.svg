<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3d80"/><stop offset="1" stop-color="#081e4c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- chart card -->
  <g filter="url(#sh)"><rect x="250" y="80" width="700" height="470" rx="28" fill="#f9f8f4"/></g>
  <text x="300" y="140" font-size="15" font-weight="700" letter-spacing="3" fill="#8a8a8a">PRICE PER MG AFTER DISCOUNT</text>
  <text x="300" y="178" font-size="28" font-weight="700" fill="#081e4c">Lower is better</text>

  <!-- gridlines -->
  <g stroke="#e8e6e0" stroke-width="2">
    <line x1="300" y1="250" x2="900" y2="250"/>
    <line x1="300" y1="330" x2="900" y2="330"/>
    <line x1="300" y1="410" x2="900" y2="410"/>
    <line x1="300" y1="490" x2="900" y2="490"/>
  </g>

  <!-- Store A -->
  <rect x="345" y="265" width="150" height="225" rx="14" fill="#cfd8f6"/>
  <text x="420" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#081e4c">$4.80</text>
  <text x="420" y="525" text-anchor="middle" font-size="17" fill="#6b6b6b">Store A · 20% off</text>

  <!-- Store B (winner) -->
  <rect x="525" y="300" width="150" height="190" rx="14" fill="#209b42"/>
  <text x="600" y="285" text-anchor="middle" font-size="26" font-weight="700" fill="#209b42">$4.05</text>
  <text x="600" y="525" text-anchor="middle" font-size="17" font-weight="700" fill="#081e4c">Store B · 10% off</text>

  <!-- Store C -->
  <rect x="705" y="230" width="150" height="260" rx="14" fill="#8b93e8" fill-opacity="0.55"/>
  <text x="780" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#081e4c">$5.40</text>
  <text x="780" y="525" text-anchor="middle" font-size="17" fill="#6b6b6b">Store C · 30% off</text>

  <!-- best value badge -->
  <g filter="url(#sh)">
    <rect x="510" y="330" width="180" height="46" rx="23" fill="#fff"/>
  </g>
  <text x="600" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#17733a">✓ Best value</text>

  <!-- formula chip -->
  <g filter="url(#sh)" transform="rotate(-6 1010 160)">
    <rect x="900" y="110" width="250" height="100" rx="20" fill="#fff"/>
    <text x="1025" y="152" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#8a8a8a">FORMULA</text>
    <text x="1025" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#081e4c">price × (1 − %) ÷ mg</text>
  </g>

  <!-- coins -->
  <g filter="url(#sh)">
    <ellipse cx="150" cy="470" rx="70" ry="22" fill="#e8a33d"/>
    <rect x="80" y="430" width="140" height="40" fill="#e8a33d"/>
    <ellipse cx="150" cy="430" rx="70" ry="22" fill="#f2b85a"/>
    <ellipse cx="150" cy="405" rx="70" ry="22" fill="#e8a33d"/>
    <rect x="80" y="365" width="140" height="40" fill="#e8a33d"/>
    <ellipse cx="150" cy="365" rx="70" ry="22" fill="#f2b85a"/>
  </g>
  <text x="150" y="372" text-anchor="middle" font-size="24" font-weight="700" fill="#8a6300">$</text>
</svg>
