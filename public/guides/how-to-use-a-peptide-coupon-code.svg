<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3d80"/><stop offset="1" stop-color="#081e4c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="1210" y="700" text-anchor="end" font-size="620" font-weight="700" fill="#fff" fill-opacity="0.05">%</text>

  <!-- checkout card -->
  <g filter="url(#sh)">
    <rect x="300" y="110" width="600" height="410" rx="28" fill="#f9f8f4"/>
  </g>
  <text x="345" y="175" font-size="15" font-weight="700" letter-spacing="3" fill="#8a8a8a">ORDER SUMMARY</text>
  <rect x="345" y="200" width="56" height="56" rx="12" fill="#dfe9f9"/>
  <rect x="363" y="212" width="20" height="32" rx="5" fill="#073774"/>
  <text x="420" y="225" font-size="20" font-weight="700" fill="#081e4c">Research peptide, 10 mg</text>
  <text x="420" y="250" font-size="16" fill="#6b6b6b">Qty 2</text>
  <text x="855" y="238" text-anchor="end" font-size="22" font-weight="700" fill="#081e4c">$120.00</text>

  <rect x="345" y="285" width="380" height="58" rx="14" fill="#effaf2" stroke="#9fd3ae" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="372" y="322" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="4" fill="#17733a">PEPLOOKUP</text>
  <rect x="740" y="285" width="115" height="58" rx="14" fill="#111"/>
  <text x="797" y="321" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Apply</text>

  <line x1="345" y1="372" x2="855" y2="372" stroke="#e8e6e0" stroke-width="2"/>
  <text x="345" y="408" font-size="18" fill="#6b6b6b">Subtotal</text>
  <text x="855" y="408" text-anchor="end" font-size="18" fill="#6b6b6b">$120.00</text>
  <text x="345" y="440" font-size="18" font-weight="700" fill="#209b42">Discount (20%)</text>
  <text x="855" y="440" text-anchor="end" font-size="18" font-weight="700" fill="#209b42">−$24.00</text>
  <text x="345" y="487" font-size="24" font-weight="700" fill="#081e4c">Total</text>
  <text x="855" y="487" text-anchor="end" font-size="28" font-weight="700" fill="#081e4c">$96.00</text>

  <!-- check badge -->
  <g filter="url(#sh)"><circle cx="905" cy="130" r="44" fill="#209b42"/></g>
  <path d="M885 131l14 14 26-28" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floating ticket -->
  <g transform="rotate(-10 190 420)" filter="url(#sh)">
    <rect x="95" y="360" width="200" height="120" rx="20" fill="#fff"/>
    <text x="195" y="425" text-anchor="middle" font-size="46" font-weight="700" fill="#081e4c">20%</text>
    <text x="195" y="455" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#8a8a8a">OFF</text>
  </g>
</svg>
