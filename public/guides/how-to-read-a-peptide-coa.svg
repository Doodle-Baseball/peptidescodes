<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3d80"/><stop offset="1" stop-color="#081e4c"/></linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f73ff" stop-opacity="0.35"/><stop offset="1" stop-color="#2f73ff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- report sheet -->
  <g filter="url(#sh)" transform="rotate(-3 600 330)">
    <rect x="310" y="70" width="580" height="500" rx="24" fill="#f9f8f4"/>
  </g>
  <g transform="rotate(-3 600 330)">
    <text x="350" y="130" font-size="15" font-weight="700" letter-spacing="3" fill="#8a8a8a">CERTIFICATE OF ANALYSIS</text>
    <text x="350" y="170" font-size="30" font-weight="700" fill="#081e4c">BPC-157 · 10 mg</text>
    <text x="350" y="200" font-size="17" fill="#6b6b6b">Batch #PC-2611-04 · Third-party lab</text>

    <!-- chromatogram -->
    <rect x="350" y="225" width="500" height="180" rx="14" fill="#fff" stroke="#e8e6e0" stroke-width="2"/>
    <path d="M370 385 L470 383 L520 380 L560 376 L585 350 L598 245 L612 350 L640 378 L700 382 L740 372 L752 360 L764 373 L830 385" fill="url(#peak)" stroke="#2f73ff" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="370" y1="386" x2="830" y2="386" stroke="#cfccc4" stroke-width="2"/>
    <text x="610" y="238" font-size="14" font-weight="700" fill="#073774">HPLC</text>

    <!-- result rows -->
    <text x="350" y="450" font-size="18" fill="#6b6b6b">Purity (HPLC)</text>
    <text x="850" y="450" text-anchor="end" font-size="22" font-weight="700" fill="#081e4c">99.2%</text>
    <line x1="350" y1="468" x2="850" y2="468" stroke="#e8e6e0" stroke-width="2"/>
    <text x="350" y="500" font-size="18" fill="#6b6b6b">Identity (MS)</text>
    <text x="850" y="500" text-anchor="end" font-size="20" font-weight="700" fill="#209b42">Confirmed</text>
    <line x1="350" y1="518" x2="850" y2="518" stroke="#e8e6e0" stroke-width="2"/>
    <text x="350" y="548" font-size="18" fill="#6b6b6b">Test date</text>
    <text x="850" y="548" text-anchor="end" font-size="18" font-weight="700" fill="#081e4c">Nov 2026</text>
  </g>

  <!-- magnifier -->
  <g filter="url(#sh)">
    <circle cx="1015" cy="400" r="78" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="12"/>
    <line x1="1071" y1="456" x2="1140" y2="525" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
  </g>
  <text x="1015" y="414" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">99%</text>

  <!-- vial -->
  <g filter="url(#sh)" transform="rotate(8 200 380)">
    <rect x="160" y="250" width="80" height="26" rx="6" fill="#cfd8f6"/>
    <rect x="150" y="276" width="100" height="210" rx="22" fill="#fff"/>
    <rect x="150" y="380" width="100" height="106" rx="22" fill="#dfe9f9"/>
    <rect x="165" y="320" width="70" height="44" rx="8" fill="#081e4c"/>
    <text x="200" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">COA</text>
  </g>
</svg>
